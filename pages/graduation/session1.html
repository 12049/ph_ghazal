<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"/>
    <title>Ghazal | الجلسة الأولى - تخرج</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
    <style>
        /* نفس الـ style من session1 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #a855f7;
            --primary-dark: #7c3aed;
            --primary-light: #d8b4fe;
            --primary-glow: rgba(168, 85, 247, 0.3);
            --bg: #0a0615;
            --bg-card: rgba(20, 15, 35, 0.7);
            --bg-card-hover: rgba(35, 25, 55, 0.85);
            --text: #f5f0ff;
            --text-secondary: #b8acd4;
            --border: rgba(168, 85, 247, 0.15);
            --glass: rgba(10, 6, 21, 0.85);
            --radius: 20px;
            --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        [data-theme="light"] {
            --primary: #7c3aed;
            --primary-dark: #5b21b6;
            --primary-light: #a78bfa;
            --bg: #f5f0ff;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-card-hover: rgba(255, 255, 255, 0.95);
            --text: #1a0a2e;
            --text-secondary: #6a5a8a;
            --border: rgba(124, 58, 237, 0.12);
            --glass: rgba(245, 240, 255, 0.9);
            --primary-glow: rgba(124, 58, 237, 0.1);
        }
        [data-theme="dark"] {
            --primary: #a855f7;
            --primary-dark: #7c3aed;
            --primary-light: #d8b4fe;
            --bg: #08080a;
            --bg-card: rgba(18, 18, 22, 0.8);
            --bg-card-hover: rgba(28, 28, 34, 0.9);
            --text: #e8e0f0;
            --text-secondary: #a098b0;
            --border: rgba(168, 85, 247, 0.12);
            --glass: rgba(8, 8, 10, 0.92);
            --primary-glow: rgba(168, 85, 247, 0.1);
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background 0.4s ease, color 0.3s ease;
            max-width: 480px;
            margin: 0 auto;
            overflow-x: hidden;
            min-height: 100vh;
        }
        .header {
            background: var(--glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            overflow: hidden;
            flex-shrink: 0;
        }
        .logo-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .logo-text h1 {
            font-size: 1.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--text), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-text span {
            font-size: 0.5rem;
            color: var(--text-secondary);
            letter-spacing: 3px;
            font-weight: 500;
            display: block;
            margin-top: -2px;
        }
        .back-btn {
            background: rgba(168, 85, 247, 0.05);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 42px;
            height: 42px;
            border-radius: 14px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .back-btn:hover {
            border-color: var(--primary);
            color: var(--primary-light);
        }
        .main-content {
            padding: 18px 16px 30px;
        }
        .section-head {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-head i {
            color: var(--primary-light);
            font-size: 1rem;
            background: rgba(168, 85, 247, 0.08);
            padding: 6px;
            border-radius: 10px;
        }
        .section-head::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(to left, var(--border), transparent);
        }
        .media-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .media-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
        }
        .media-item:active {
            transform: scale(0.95);
        }
        .media-item .media-preview {
            width: 100%;
            height: 180px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
        }
        .media-item .media-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .fullscreen-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 1000;
            padding: 20px;
            align-items: center;
            justify-content: center;
        }
        .fullscreen-modal.open {
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .fullscreen-modal .fullscreen-content {
            max-width: 95%;
            max-height: 90%;
            border-radius: var(--radius);
            box-shadow: 0 0 60px var(--primary-glow);
            position: relative;
        }
        .fullscreen-modal .fullscreen-content img {
            width: 100%;
            height: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: var(--radius);
        }
        .fullscreen-modal .close-fullscreen {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            width: 44px;
            height: 44px;
            border-radius: 14px;
            font-size: 1.3rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .fullscreen-modal .close-fullscreen:hover {
            border-color: var(--primary);
            color: var(--primary-light);
        }
        .loading {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
        }
        .loading i {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        .empty-state i {
            font-size: 3rem;
            opacity: 0.3;
            display: block;
            margin-bottom: 12px;
        }
        @media (max-width: 380px) {
            .media-item .media-preview { height: 140px; }
        }
        @media (max-width: 340px) {
            .media-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="logo-wrap">
            <div class="logo-avatar">
                <img src="../../images/avatar1.png" alt="Ghazal"/>
            </div>
            <div class="logo-text">
                <h1>Ghazal</h1>
                <span>PHOTOGRAPHY</span>
            </div>
        </div>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-right"></i></a>
    </header>

    <main class="main-content">
        <div class="section-head"><i class="fas fa-image"></i> <span id="sessionTitle">الجلسة الأولى - تخرج</span></div>
        <div id="imagesContainer"><div class="loading"><i class="fas fa-spinner"></i> جاري التحميل...</div></div>
    </main>

    <div class="fullscreen-modal" id="fullscreenModal" onclick="closeFullscreen()">
        <button class="close-fullscreen" onclick="event.stopPropagation(); closeFullscreen();"><i class="fas fa-times"></i></button>
        <div class="fullscreen-content" id="fullscreenContent" onclick="event.stopPropagation();"><img src="" alt="صورة مكبرة"/></div>
    </div>

    <script>
        const sessionConfig = { totalImages: 20, imagePrefix: 'تخرج', imageExtension: 'jpg', folderPath: '../../images/graduation/session1/', title: 'الجلسة الأولى - تخرج' };

        function loadImages() {
            const container = document.getElementById('imagesContainer');
            document.getElementById('sessionTitle').textContent = sessionConfig.title;
            let html = '<div class="media-grid">';
            for (let i = 1; i <= sessionConfig.totalImages; i++) {
                const imgSrc = `${sessionConfig.folderPath}${sessionConfig.imagePrefix}${i}.${sessionConfig.imageExtension}`;
                html += `<div class="media-item" id="img-${i}" onclick="openFullscreen('${imgSrc}')"><div class="media-preview"><img src="${imgSrc}" alt="${sessionConfig.imagePrefix} ${i}" onerror="document.getElementById('img-${i}').style.display='none';" loading="lazy"/></div></div>`;
            }
            html += '</div>';
            container.innerHTML = html;
            setTimeout(() => {
                if (document.querySelectorAll('.media-item:not([style*="display: none"])').length === 0) {
                    container.innerHTML = `<div class="empty-state"><i class="fas fa-image"></i><p>لا توجد صور في هذه الجلسة</p></div>`;
                }
            }, 500);
        }

        function openFullscreen(src) {
            const img = new Image();
            img.onload = function() {
                document.getElementById('fullscreenContent').innerHTML = `<img src="${src}" alt="صورة مكبرة"/>`;
                document.getElementById('fullscreenModal').classList.add('open');
                document.body.style.overflow = 'hidden';
            };
            img.onerror = function() {};
            img.src = src;
        }

        function closeFullscreen() {
            document.getElementById('fullscreenModal').classList.remove('open');
            document.body.style.overflow = '';
        }

        document.addEventListener('DOMContentLoaded', loadImages);
        window.openFullscreen = openFullscreen;
        window.closeFullscreen = closeFullscreen;
    </script>

</body>
</html>
